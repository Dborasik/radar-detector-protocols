      - Field length 1 describes one payload element; list settings may return multiple one-byte values after the setting ID.
      - Compatible-family research uses a single 0xF4 value after the setting ID to indicate an unsupported setting.
      - The RAD 700i capture directly observed 8B responses for IDs 01, 02, 07, 0A, 0E, 10, 13, 14, 15, 16, 24, 25, 26, 28, 29, 2B, and 2C.
      - IDs 13 and 14 both returned bytes 14 A0 05 after the ID. These match the compatible-family range convention of minimum 20, maximum 160, increment 5, but the user-facing setting identity remains under physical correlation.

