            confidence: observed
            firmware: M1.2.3.6
            evidence:
              - drive-smarter-capture-2026-09-11
        evidence:
          - car-hud-implementation
          - drive-smarter-capture-2026-09-11
        notes:
          - Carries alert-state traffic and framed detector-to-client protocol traffic.

      - id: gps-characteristic
        kind: ble-characteristic
        identifier: 0000fe51-8e22-4541-9d4c-21edae82ed19
        confidence: observed
        properties:
          - read
          - notify
        observed_handles:
          - value: "0x000e"
            confidence: observed
            firmware: null
            evidence:
              - car-hud-implementation
        evidence:
          - car-hud-implementation
        notes:
          - The characteristic's GPS interpretation has not been independently reproduced by this repository.

messages:
  - id: radar-alert
    transport: ble-main
    endpoint: alert-characteristic
    direction: detector-to-client
    confidence: observed
    description: Radar/laser alert notification or readable alert state.
    minimum_length: 1
    evidence:
      - car-hud-implementation
    fields:
      - name: band_code
        offset: 0
        length: 1
        type: u8
        endianness: null
        confidence: observed
        evidence:
          - car-hud-implementation
        values:
          "0x00":
            meaning: No active alert / alert cleared
            confidence: inferred
            evidence:
              - car-hud-implementation
          "0x01":
            meaning: X band
            confidence: observed
            evidence:
              - car-hud-implementation
          "0x02":
            meaning: K band
            confidence: observed
            evidence:
              - car-hud-implementation
          "0x04":
            meaning: Ka band
            confidence: observed
            evidence:
              - car-hud-implementation
          "0x08":
            meaning: Laser
            confidence: observed
            evidence:
              - car-hud-implementation
          "0x10":
            meaning: Ka POP
            confidence: observed
            evidence:
              - car-hud-implementation
          "0x20":
            meaning: K POP
            confidence: observed
            evidence:
              - car-hud-implementation
      - name: signal_strength
        offset: 1
        length: 1
        type: u8
        endianness: null
        confidence: inferred
        evidence:
          - car-hud-implementation
        notes:
          - The seed implementation treats byte 1 as alert strength and caps its displayed value at 10; actual scaling is not independently characterized.
    notes:
      - Whether band codes can combine as a bitfield is unknown.

  - id: gps-update
    transport: ble-main
    endpoint: gps-characteristic
    direction: detector-to-client
    confidence: hypothesis
    description: Candidate GPS state packet carried by the GPS characteristic.
    minimum_length: 12
    evidence:
      - car-hud-implementation
    fields:
      - name: latitude
        offset: 0
        length: 4
        type: i32
        endianness: little
        confidence: hypothesis
        scale: 0.0000001
        unit: degrees
        evidence:
          - car-hud-implementation
      - name: longitude
        offset: 4
        length: 4
        type: i32
        endianness: little
        confidence: hypothesis
        scale: 0.0000001
        unit: degrees
        evidence:
          - car-hud-implementation
      - name: speed
        offset: 8
        length: 2
        type: u16
        endianness: little
        confidence: hypothesis
        unit: unknown
        evidence:
