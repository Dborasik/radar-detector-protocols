    notes: Used to name captured command IDs and corroborate challenge/response transforms. Captured RAD 700i A3 to A2 and A1 to A4 pairs match the documented BLE transforms exactly.

notes:
  - This entry distinguishes direct RAD 700i observations from compatible-family semantic corroboration.
  - F5 framing and the observed authentication/status/speed command IDs are directly evidenced on a physical RAD 700i.
  - DISPLAY_MESSAGE (0x9A) and PLAY_TONE (0x9B) client-request behavior remain unconfirmed because this capture did not exercise those requests.
  - Individual detector-setting semantics, cloud/community alerts, lockout synchronization, and firmware-update behavior remain incomplete.

