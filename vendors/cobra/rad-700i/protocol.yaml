      - id: tx-characteristic
        kind: ble-characteristic
        identifier: b5e22dea-31ee-42ab-be6a-9be0837aa344
        confidence: observed
        properties:
          - write
        observed_handles:
          - value: "0x0022"
            confidence: observed
            firmware: M1.2.3.6
            evidence:
              - drive-smarter-capture-2026-09-11
        evidence:
          - drive-smarter-capture-2026-09-11
        notes:
          - Drive Smarter client-to-detector F5 frames were directly observed on this characteristic.

      - id: alert-characteristic
        kind: ble-characteristic
        identifier: b5e22deb-31ee-42ab-be6a-9be0837aa344
