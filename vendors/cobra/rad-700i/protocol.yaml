hypotheses:
  - id: display-location-five-byte-pack
    confidence: hypothesis
    description: A compatible-family implementation packs client DISPLAY_LOCATION (0xAD) into five 7-bit-safe bytes combining alert type, distance, heading, age, and a database flag.
    evidence:
      - roadsage-compatible-protocol
      - esclib-compatible-protocol
    test_needed: Capture a real Drive Smarter community/location alert sent to the physical RAD 700i, or reproduce one in a controlled non-persistent test, then compare the exact five-byte payload before exposing this write in the toolbox.

  - id: status-embedded-alert-tail
    confidence: hypothesis
    description: Compatible-family status responses may append an A9 front/rear alert record after the first status byte.
    evidence:
      - esclib-compatible-protocol
    test_needed: Capture a physical RAD 700i Status 0x99 frame during an active alert and check whether bytes after the state byte begin with 0xA9 and correlate with the simultaneous alert notification/display.

  - id: alert-a9-compatible-band-direction-map
    confidence: hypothesis
    description: Public Max 360 injection research maps the A9 band byte into repeating band families and maps direction/strength values 0x00-0x7F into none/front/rear/side blocks plus five signal-strength levels.
    evidence:
      - max360-serial-research
    test_needed: Capture physical RAD 700i A9 alert records while recording the detector's displayed band and strength; compare multiple strengths and, where the model exposes it, direction.

  - id: alert-frequency-14bit-wrap
    confidence: hypothesis
    description: The two A9 frequency bytes may form a 14-bit value from two 7-bit chunks, with X using the raw value, K unwrapped by adding 0x4000, and Ka unwrapped by adding 0x8000 to obtain candidate MHz.
    evidence:
      - max360-serial-research
      - esclib-compatible-protocol
    test_needed: Compare candidate decoded MHz against the physical RAD 700i displayed frequency across at least two known X/K/Ka alerts before promoting the formula.

  - id: alert-front-rear-five-byte-fields
    confidence: hypothesis
    description: Compatible-family A9 alert records may encode two frequency bytes, a band byte, a direction/strength byte, and one additional changing byte.
    evidence:
      - max360-serial-research
      - esclib-compatible-protocol
    test_needed: Capture a physical RAD 700i A9 alert while recording the detector's displayed band, exact frequency, signal strength, and direction if available; repeat across bands and strengths.

  - id: settings-id-map
    confidence: hypothesis
    description: Older compatible-family setting IDs/names may overlap portions of the RAD 700i settings surface, but the model-specific Cobra menu differs and must be mapped by physical correlation rather than assumed wholesale.
    evidence:
      - drive-smarter-capture-2026-09-11
      - esclib-compatible-protocol
      - cobra-rad700i-support
    test_needed: Query all setting IDs read-only with 0x82, record 0x8A/0x8B responses, compare with current physical menu state, then isolate any ambiguous IDs with one-setting-at-a-time Drive Smarter captures.

  - id: gps-short-layout
    confidence: hypothesis
    description: A public implementation attempts a second GPS decode for payloads of at least 6 bytes using latitude i32 little-endian scaled by 1e-6 and longitude i16 little-endian scaled by 1e-4.
    evidence:
      - car-hud-implementation
    test_needed: Capture raw GPS characteristic notifications with known coordinates and compare payload lengths and decoded values across GPS lock states.

  - id: alert-band-bitfield
    confidence: unknown
    description: The band-code values are powers of two, but the seed implementation treats byte 0 as a single enum. It is unknown whether combined values are valid bit flags.
    evidence:
      - car-hud-implementation
    test_needed: Capture notifications during overlapping or multi-signal alerts and check whether byte 0 combines values.

